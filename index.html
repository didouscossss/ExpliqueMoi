<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ExpliqueMoi</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

</head>

<body>

<header>

<div class="logo">
🧠
</div>

<div>
<h1>ExpliqueMoi</h1>
<p>Comprendre vos documents simplement</p>
</div>

</header>


<main>

<section class="card">

<h2>Importer un document</h2>

<div class="buttons">

<label class="upload">

📷 Scanner

<input
type="file"
accept="image/*"
capture="environment"
id="camera">

</label>

<label class="upload">

📄 PDF

<input
type="file"
accept="application/pdf,image/*"
id="file">

</label>

</div>

<textarea
id="text"
placeholder="Ou collez directement le texte ici..."></textarea>

<button id="analyse">

Analyser le document

</button>

</section>


<section id="resultats" class="hidden">

<div class="bloc">

<h3>📄 C'est quoi ?</h3>

<p id="type"></p>

</div>

<div class="bloc">

<h3>😊 Dois-je m'inquiéter ?</h3>

<p id="stress"></p>

</div>

<div class="bloc">

<h3>👉 Ce que tu dois faire</h3>

<ul id="todo"></ul>

</div>

<div class="bloc">

<h3>📅 Dates importantes</h3>

<ul id="dates"></ul>

</div>

<div class="bloc">

<h3>❓ Pourquoi tu l'as reçu ?</h3>

<p id="why"></p>

</div>

<div class="bloc">

<h3>📍 Où je vois ça ?</h3>

<div id="proofs"></div>

</div>

<div class="bloc">

<h3>💬 Poser une question</h3>

<input
id="question"
placeholder="Ex : Dois-je payer ?">

<button id="ask">

Poser la question

</button>

<p id="answer"></p>

</div>

</section>

</main>

<script type="module" src="script.js"></script>

</body>
</html>
